<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Layanan Garansi & Klaim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root {
            --primary-blue: #0078d4;
            --accent-cyan: #00bcf2;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 15px 35px rgba(0, 120, 212, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --valid-green: #10b981;
            --invalid-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #e1f5fe 70%, #bae6fd 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Orbs background */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
        body::before {
            width: 350px;
            height: 350px;
            background: rgba(0, 188, 242, 0.35);
            top: 10%;
            left: 15%;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.25);
            bottom: 10%;
            right: 15%;
        }

        .aero-card {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .aero-header {
            padding: 25px 25px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
        }

        .aero-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-blue);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .aero-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .nav-tabs {
            display: flex;
            padding: 0 20px;
            gap: 10px;
            margin-bottom: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            font-weight: 600;
            font-size: 13px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
            color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.15);
            border-color: #ffffff;
        }

        .aero-body {
            padding: 20px 25px 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 12px;
            padding: 0 14px;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .input-wrapper:focus-within {
            background: #ffffff;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 188, 242, 0.2);
        }

        .input-wrapper i {
            color: var(--accent-cyan);
            margin-right: 12px;
            font-size: 15px;
        }

        input[type="text"], input[type="email"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 70px;
            padding: 10px 0;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--primary-blue) 100%);
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 120, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        button.action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 120, 212, 0.4);
            filter: brightness(1.05);
        }

        #result, #claimResult {
            margin-top: 18px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .valid {
            border-left: 4px solid var(--valid-green) !important;
            color: #065f46;
        }

        .invalid {
            border-left: 4px solid var(--invalid-red) !important;
            color: #991b1b;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding: 6px 0;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Custom Scrollbar for Aero feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 120, 212, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="aero-card">
    <div class="aero-header">
        <div class="aero-title">
            <i class="fa-solid fa-shield-halved"></i> PORTAL GARANSI RESMI
        </div>
        <div class="aero-subtitle">PT. Laksana Digital Industri</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('checkTab', this)">
            <i class="fa-solid fa-magnifying-glass"></i> Cek Garansi
        </button>
        <button class="tab-btn" onclick="switchTab('claimTab', this)">
            <i class="fa-solid fa-file-signature"></i> Klaim Garansi
        </button>
    </div>
    
    <div class="aero-body">
        
        <!-- TAB 1: CEK GARANSI -->
        <div id="checkTab" class="tab-content active">
            <div class="input-group">
                <label for="warrantyId">Nomor Garansi</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-barcode"></i>
                    <input type="text" id="warrantyId" placeholder="Contoh: GRS-12345" autocomplete="off">
                </div>
            </div>

            <button class="g-recaptcha action-btn" 
                data-sitekey="MASUKKAN_SITE_KEY_RECAPTCHA_ANDA" 
                data-callback="onCheckSubmit" 
                data-action="submit">
                <i class="fa-solid fa-search"></i> Periksa Status
            </button>

            <div id="result"></div>
        </div>

        <!-- TAB 2: KLAIM GARANSI -->
        <div id="claimTab" class="tab-content">
            <div class="input-group">
                <label for="claimNoGaransi">Nomor Garansi</label>
                <div class="input-wrapper"><i class="fa-solid fa-id-card"></i><input type="text" id="claimNoGaransi" placeholder="GRS-12345"></div>
            </div>
            <div class="input-group">
                <label for="claimNama">Nama Lengkap</label>
                <div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="claimNama" placeholder="Nama Pelanggan"></div>
            </div>
            <div class="input-group">
                <label for="claimEmail">Email Aktif</label>
                <div class="input-wrapper"><i class="fa-solid fa-envelope"></i><input type="email" id="claimEmail" placeholder="nama@email.com"></div>
            </div>
            <div class="input-group">
                <label for="claimDeskripsi">Deskripsi Kerusakan</label>
                <div class="input-wrapper"><i class="fa-solid fa-wrench"></i><textarea id="claimDeskripsi" placeholder="Jelaskan detail kendala unit..."></textarea></div>
            </div>
            <div class="input-group">
                <label for="claimFoto">Foto Kerusakan (Max 5MB)</label>
                <div class="input-wrapper"><i class="fa-solid fa-camera"></i><input type="file" id="claimFoto" accept="image/*"></div>
            </div>

            <button class="g-recaptcha action-btn" 
                data-sitekey="MASUKKAN_SITE_KEY_RECAPTCHA_ANDA" 
                data-callback="onClaimSubmit" 
                data-action="submit">
                <i class="fa-solid fa-paper-plane"></i> Kirim Pengajuan Klaim
            </button>

            <div id="claimResult"></div>
        </div>

    </div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzv-TrI-HkrhvyihaQ7HLpww42qfwzVPhW4eJB2Whe9uyiwG9ycqPnlFRDNhrJSh9p4/exec";

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    async function onCheckSubmit(token) {
        const id = document.getElementById('warrantyId').value.trim();
        const resultDiv = document.getElementById('result');
        if (!id) { showResult(resultDiv, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon masukkan nomor garansi."); grecaptcha.reset(); return; }

        resultDiv.style.display = "block";
        resultDiv.className = "";
        resultDiv.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Memeriksa data...";

        try {
            const res = await fetch(`${webAppUrl}?id=${encodeURIComponent(id)}&captcha=${encodeURIComponent(token)}`);
            const data = await res.json();
            
            if (data.valid) {
                showResult(resultDiv, "valid", `
                    <div style="margin-bottom: 8px; font-weight: bold;"><i class="fa-solid fa-circle-check"></i> GARANSI VALID</div>
                    <div class="data-row"><span>No. Garansi:</span><strong>${data.noGaransi}</strong></div>
                    <div class="data-row"><span>Nama:</span><strong>${data.nama}</strong></div>
                    <div class="data-row"><span>Produk:</span><strong>${data.produk}</strong></div>
                    <div class="data-row"><span>Masa Kadaluarsa:</span><strong>${data.expired}</strong></div>
                `);
            } else {
                showResult(resultDiv, "invalid", "<i class='fa-solid fa-circle-xmark'></i> Nomor garansi tidak terdaftar / tidak valid.");
            }
        } catch(e) {
            showResult(resultDiv, "invalid", "<i class='fa-solid fa-triangle-exclamation'></i> Terjadi kesalahan sistem. Coba lagi.");
        } finally { grecaptcha.reset(); }
    }

    async function onClaimSubmit(token) {
        const noGaransi = document.getElementById('claimNoGaransi').value.trim();
        const nama = document.getElementById('claimNama').value.trim();
        const email = document.getElementById('claimEmail').value.trim();
        const deskripsi = document.getElementById('claimDeskripsi').value.trim();
        const fotoInput = document.getElementById('claimFoto');
        const claimResult = document.getElementById('claimResult');

        if (!noGaransi || !nama || !email || !deskripsi || fotoInput.files.length === 0) {
            showResult(claimResult, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon lengkapi semua data dan lampirkan foto.");
            grecaptcha.reset();
            return;
        }

        claimResult.style.display = "block";
        claimResult.className = "";
        claimResult.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Mengirim pengajuan klaim...";

        const file = fotoInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function () {
            const base64File = reader.result;
            const payload = {
                noGaransi: noGaransi,
                nama: nama,
                email: email,
                deskripsi: deskripsi,
                fileData: base64File,
                captcha: token
            };

            try {
                const res = await fetch(webAppUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    showResult(claimResult, "valid", `
                        <div style="margin-bottom: 8px; font-weight: bold;"><i class="fa-solid fa-circle-check"></i> KLAIM BERHASIL DIAJUKAN</div>
                        <div class="data-row"><span>No. Tiket:</span><strong>${data.ticketId}</strong></div>
                        <div class="data-row"><span>Status:</span><strong>MENUNGGU ANALISA</strong></div>
                        <small style="display:block; margin-top:8px; color:#4b5563;">Bukti penerimaan telah dikirimkan ke email Anda.</small>
                    `);
                    document.getElementById('claimNoGaransi').value = '';
                    document.getElementById('claimDeskripsi').value = '';
                    fotoInput.value = '';
                } else {
                    showResult(claimResult, "invalid", "<i class='fa-solid fa-circle-xmark'></i> Gagal memproses klaim: " + (data.error || "Kesalahan internal."));
                }
            } catch(e) {
                showResult(claimResult, "invalid", "<i class='fa-solid fa-triangle-exclamation'></i> Terjadi kesalahan jaringan.");
            } finally { grecaptcha.reset(); }
        };
    }

    function showResult(el, className, content) {
        el.style.display = "block";
        el.className = className;
        el.innerHTML = content;
    }
</script>
</body>
</html>
