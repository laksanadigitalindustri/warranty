<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Garansi & Klaim Layanan - PT. Laksana Digital Industri</title>
    <!-- FontAwesome CDN untuk Icon Asli -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google reCAPTCHA API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root {
            --bg-canvas: #f4f6f9;
            --surface-card: #ffffff;
            --surface-subtle: #f8fafc;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --primary-700: #0f172a;
            --primary-600: #1e293b;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            --status-success-bg: #f0fdf4;
            --status-success-border: #bbf7d0;
            --status-success-text: #15803d;
            
            --status-error-bg: #fef2f2;
            --status-error-border: #fecaca;
            --status-error-text: #b91c1c;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .portal-container {
            width: 100%;
            max-width: 580px;
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        .portal-header {
            padding: 32px 32px 24px 32px;
            border-bottom: 1px solid var(--border-light);
            background: var(--surface-card);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent-blue);
            background: rgba(37, 99, 235, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(37, 99, 235, 0.12);
        }

        .portal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.4px;
            line-height: 1.2;
        }

        .portal-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Modern Segmented Navigation Tabs */
        .tab-wrapper {
            padding: 16px 32px 0 32px;
            background: var(--surface-card);
        }

        .nav-tabs {
            display: flex;
            background: var(--surface-subtle);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--surface-card);
            color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
        }

        .portal-body {
            padding: 24px 32px 32px 32px;
        }

        .form-section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-control-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-light);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        textarea.form-input {
            padding: 10px 14px 10px 40px;
            resize: vertical;
            min-height: 80px;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-input:focus + .input-icon,
        .input-control-wrapper:focus-within .input-icon {
            color: var(--accent-blue);
        }

        /* Styling khusus File Upload Input */
        .file-input-wrapper {
            border: 1px dashed var(--border-hover);
            background: var(--surface-subtle);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .file-input-wrapper:hover {
            border-color: var(--accent-blue);
            background: rgba(37, 99, 235, 0.02);
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .file-input-label i {
            font-size: 20px;
            color: var(--accent-blue);
        }

        .file-name-display {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
            word-break: break-all;
        }

        .recaptcha-box {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px 0;
        }

        button.action-btn {
            width: 100%;
            padding: 12px 20px;
            background: var(--primary-700);
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        button.action-btn:hover {
            background: var(--primary-600);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        /* Result Panel Layout */
        #result, #claimResult {
            margin-top: 20px;
            padding: 16px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 13px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.valid {
            background: var(--status-success-bg);
            border: 1px solid var(--status-success-border);
            color: var(--status-success-text);
        }

        .result-card.invalid {
            background: var(--status-error-bg);
            border: 1px solid var(--status-error-border);
            color: var(--status-error-text);
        }

        .data-list {
            margin-top: 10px;
            background: var(--surface-card);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-light);
            color: var(--text-main);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-row span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .portal-footer {
            padding: 16px 32px;
            background: var(--surface-subtle);
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .portal-footer span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="portal-header">
        <div class="brand-badge">
            <i class="fa-solid fa-shield-halved"></i> PT. Laksana Digital Industri
        </div>
        <h1 class="portal-title">Portal Garansi & Klaim Layanan</h1>
        <p class="portal-subtitle">Sistem verifikasi resmi garansi unit dan pengajuan klaim teknis.</p>
    </div>

    <div class="tab-wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('checkTab', this)">
                <i class="fa-solid fa-magnifying-glass"></i> Cek Status Garansi
            </button>
            <button class="tab-btn" onclick="switchTab('claimTab', this)">
                <i class="fa-solid fa-file-signature"></i> Pengajuan Klaim
            </button>
        </div>
    </div>
    
    <div class="portal-body">
        
        <!-- TAB 1: CEK GARANSI -->
        <div id="checkTab" class="tab-content active">
            <div class="form-section-title">Pencarian Unit</div>
            
            <div class="input-group">
                <label for="warrantyId">Nomor Serial / Kode Garansi</label>
                <div class="input-control-wrapper">
                    <i class="fa-solid fa-barcode input-icon"></i>
                    <input type="text" id="warrantyId" class="form-input" placeholder="Masukkan ID Garansi (Contoh: GRS-12345)" autocomplete="off">
                </div>
            </div>

            <div class="recaptcha-box">
                <div id="captchaCheck" class="g-recaptcha" data-sitekey="6Ld-I2gtAAAAAOAPiufOd_ARHEvzKzpNkhv9xgcm"></div>
            </div>

            <button type="button" class="action-btn" onclick="onCheckSubmit()">
                <i class="fa-solid fa-search"></i> Periksa Garansi
            </button>

            <div id="result" class="result-card"></div>
        </div>

        <!-- TAB 2: KLAIM GARANSI -->
        <div id="claimTab" class="tab-content">
            <div class="form-section-title">Identitas & Detail Klaim</div>

            <div class="input-group">
                <label for="claimNoGaransi">Nomor Garansi Unit</label>
                <div class="input-control-wrapper">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input type="text" id="claimNoGaransi" class="form-input" placeholder="GRS-12345">
                </div>
            </div>

            <div class="input-group">
                <label for="claimNama">Nama Lengkap Pemilik</label>
                <div class="input-control-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="claimNama" class="form-input" placeholder="Sesuai kartu identitas">
                </div>
            </div>

            <div class="input-group">
                <label for="claimEmail">Alamat Email Aktif</label>
                <div class="input-control-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="claimEmail" class="form-input" placeholder="nama@perusahaan.com">
                </div>
            </div>

            <div class="input-group">
                <label for="claimDeskripsi">Deskripsi Kendala Hardware / Sistem</label>
                <div class="input-control-wrapper">
                    <i class="fa-solid fa-triangle-exclamation input-icon" style="top: 14px;"></i>
                    <textarea id="claimDeskripsi" class="form-input" placeholder="Jelaskan detail masalah fisik atau fungsionalitas unit..."></textarea>
                </div>
            </div>

            <div class="input-group">
                <label>Bukti Foto Kerusakan (Maks. 5MB)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="claimFoto" accept="image/*" onchange="updateFileName(this)">
                    <div class="file-input-label">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Klik atau seret foto ke area ini</span>
                    </div>
                    <div id="fileNameDisplay" class="file-name-display"></div>
                </div>
            </div>

            <div class="recaptcha-box">
                <div id="captchaClaim" class="g-recaptcha" data-sitekey="6Ld-I2gtAAAAAOAPiufOd_ARHEvzKzpNkhv9xgcm"></div>
            </div>

            <button type="button" class="action-btn" onclick="onClaimSubmit()">
                <i class="fa-solid fa-paper-plane"></i> Kirim Form Klaim
            </button>

            <div id="claimResult" class="result-card"></div>
        </div>

    </div>

    <div class="portal-footer">
        <span><i class="fa-solid fa-lock"></i> Ensiklopedia Enkripsi Sistem</span>
        <span>© 2026 PT. Laksana Digital Industri</span>
    </div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzv-TrI-HkrhvyihaQ7HLpww42qfwzVPhW4eJB2WheuyiwG9ycqPnlFRDNhrJSh9p4/exec";

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files && input.files[0]) {
            display.textContent = "Terlampir: " + input.files[0].name;
        } else {
            display.textContent = "";
        }
    }

    function safeResetCaptcha(widgetId) {
        if (typeof grecaptcha !== 'undefined' && grecaptcha.reset) {
            if (widgetId !== undefined) {
                grecaptcha.reset(widgetId);
            } else {
                grecaptcha.reset();
            }
        }
    }

    async function onCheckSubmit() {
        const id = document.getElementById('warrantyId').value.trim();
        const resultDiv = document.getElementById('result');
        const token = grecaptcha.getResponse(0);

        if (!id) { 
            showResult(resultDiv, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon masukkan nomor garansi."); 
            return; 
        }

        if (!token) {
            showResult(resultDiv, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon verifikasi reCAPTCHA.");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.className = "result-card";
        resultDiv.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Memeriksa data pada basis data pusat...";

        try {
            const res = await fetch(`${webAppUrl}?id=${encodeURIComponent(id)}&captcha=${encodeURIComponent(token)}`);
            const data = await res.json();
            
            if (data.valid) {
                showResult(resultDiv, "valid", `
                    <div style="font-weight: 700; display:flex; align-items:center; gap:8px;">
                        <i class="fa-solid fa-circle-check"></i> STATUS GARANSI VALID
                    </div>
                    <div class="data-list">
                        <div class="data-row"><span>No. Garansi</span><strong>${data.noGaransi}</strong></div>
                        <div class="data-row"><span>Nama Pemilik</span><strong>${data.nama}</strong></div>
                        <div class="data-row"><span>Tipe Produk</span><strong>${data.produk}</strong></div>
                        <div class="data-row"><span>Masa Berlaku s/d</span><strong>${data.expired}</strong></div>
                    </div>
                `);
            } else {
                showResult(resultDiv, "invalid", "<i class='fa-solid fa-circle-xmark'></i> Nomor garansi tidak terdaftar atau telah kadaluarsa.");
            }
        } catch(e) {
            showResult(resultDiv, "invalid", "<i class='fa-solid fa-triangle-exclamation'></i> Terjadi kesalahan sistem. Silakan coba kembali.");
        } finally { 
            safeResetCaptcha(0); 
        }
    }

    async function onClaimSubmit() {
        const noGaransi = document.getElementById('claimNoGaransi').value.trim();
        const nama = document.getElementById('claimNama').value.trim();
        const email = document.getElementById('claimEmail').value.trim();
        const deskripsi = document.getElementById('claimDeskripsi').value.trim();
        const fotoInput = document.getElementById('claimFoto');
        const claimResult = document.getElementById('claimResult');
        const token = grecaptcha.getResponse(1);

        if (!noGaransi || !nama || !email || !deskripsi || fotoInput.files.length === 0) {
            showResult(claimResult, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon lengkapi seluruh kolom formulir dan lampirkan foto.");
            return;
        }

        if (!token) {
            showResult(claimResult, "invalid", "<i class='fa-solid fa-circle-exclamation'></i> Mohon verifikasi reCAPTCHA.");
            return;
        }

        claimResult.style.display = "block";
        claimResult.className = "result-card";
        claimResult.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Mengirimkan data klaim ke server...";

        const file = fotoInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
            const base64File = reader.result;
            const payload = {
                noGaransi: noGaransi,
                nama: nama,
                email: email,
                deskripsi: deskripsi,
                fileData: base64File,
                captcha: token
            };

            const params = new URLSearchParams();
            params.append("data", JSON.stringify(payload));

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
            .then(() => {
                showResult(claimResult, "valid", `
                    <div style="font-weight: 700; display:flex; align-items:center; gap:8px;">
                        <i class="fa-solid fa-circle-check"></i> KLAIM BERHASIL TERKIRIM
                    </div>
                    <p style="margin-top:6px; color: var(--text-muted); font-size: 12px;">
                        Pengajuan Anda telah diterima oleh sistem. Tim teknis PT. Laksana Digital Industri akan memproses tiket dalam kurun waktu 1x24 jam.
                    </p>
                `);
                document.getElementById('claimNoGaransi').value = '';
                document.getElementById('claimNama').value = '';
                document.getElementById('claimEmail').value = '';
                document.getElementById('claimDeskripsi').value = '';
                fotoInput.value = '';
                document.getElementById('fileNameDisplay').textContent = '';
            })
            .catch(() => {
                showResult(claimResult, "invalid", "<i class='fa-solid fa-triangle-exclamation'></i> Kesalahan jaringan saat mengirimkan form.");
            })
            .finally(() => {
                safeResetCaptcha(1);
            });
        };
        reader.onerror = function () {
            showResult(claimResult, "invalid", "<i class='fa-solid fa-triangle-exclamation'></i> Gagal membaca berkas gambar.");
            safeResetCaptcha(1);
        };
    }

    function showResult(el, className, content) {
        el.style.display = "block";
        el.className = "result-card " + className;
        el.innerHTML = content;
    }
</script>
</body>
</html>
